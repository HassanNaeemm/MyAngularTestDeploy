<div class="container">
    <h1>Login Now</h1>
    <hr/>
    <b class="mt-3 ">Enter Email</b>
    <br>
    <input type="text" name="email" [(ngModel)]="email" class="w-50 p-1">
    <br/> 
    <b class="mt-3 ">Enter Password</b>
    <br>
    <input type="password" name="password" [(ngModel)]="password" class="w-50 p-1">
    <br>
    <button class="btn btn-primary mt-3 w-50" (click)="login()">Login</button>
</div>
